# Live overlay: route the IM2A MCP row to the local Agent Plugins 2.0
# HTTP MCP service. No token, binary path, or launcher is stored here.
#
# This bundle must be selected after @twinsearth/im2a-dsh-plugin. The host
# bundle inserts `im2a-mcp`; this overlay replaces its transport config.
- id: im2a-mcp
  config:
    serverName: im2a
    transport: streamable-http
    url: "http://127.0.0.1:18082/mcp"
    failOnStartupError: true
