# AI 人机混合熟人社交 IM 平台 · v0.2 基础依赖编排
# 用途：本地开发环境一键启动基础中间件（§2 数据层/§2.4 协商通道依赖）。
# 启动：make up    停止：make down
# 首次启动 postgres 会自动执行 deploy/migrations/*.sql（仅对空数据卷初始化一次）。
# 应用服务（services/*）为纯 Go 进程，本地直接 go run 即可，无需容器化。

services:
  postgres:
    image: postgres:16-alpine
    container_name: hai-postgres
    environment:
      POSTGRES_USER: hai
      POSTGRES_PASSWORD: hai_dev
      POSTGRES_DB: hai_platform
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # 仅在数据卷首次初始化时按文件名顺序执行（001_init.sql ...）
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hai"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  # Kafka（KRaft 单节点，无 ZooKeeper；Agent 审计/协商事件流）
  kafka:
    image: apache/kafka:3.8.0
    container_name: hai-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data

  # 服务发现（Go-Zero / gRPC）
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: hai-etcd
    environment:
      ETCD_NAME: hai-etcd
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_CLUSTER: hai-etcd=http://0.0.0.0:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: hai-etcd-token
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - etcd_data:/etcd-data

  # 消息归档全文检索（§2.5；生产接对象存储）
#   opensearch:
#     image: opensearchproject/opensearch:2.14.0
#     container_name: hai-opensearch
#     environment:
#       discovery.type: single-node
#       plugins.security.disabled: "true"
#       OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
#     ports:
#       - "9200:9200"
#     volumes:
#       - os_data:/usr/share/opensearch/data
# 
volumes:
  pg_data:
  redis_data:
  kafka_data:
  etcd_data:
  os_data:
