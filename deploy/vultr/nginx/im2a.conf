# SPDX-License-Identifier: MIT
# IM2A gateway public vhost - NEW FILE ONLY.
# Source of truth: deploy/vultr/nginx/im2a.conf
# Installed to:    /etc/nginx/conf.d/im2a.conf  (by deploy/vultr/install.sh)
#
# This file does NOT modify, replace or reorder any existing nginx configuration:
#   /etc/nginx/conf.d/w2m.conf       keeps `listen 80 default_server` and the W2M relay
#   /etc/nginx/conf.d/alone.conf     keeps 127.0.0.1:31300 / 31302 (xray/v2ray-agent)
#   /etc/nginx/conf.d/subscribe.conf keeps 35521 ssl (geefish.cn)
# Bare-IP requests on :80 still land on the w2m default_server (Host: <ip> is not matched by
# this server_name), so the w2m fleet, /pub/ release downloads and subscribe links are
# unaffected.
#
# Why a nip.io hostname instead of "<ip>:<port>":
#   * Port 18080 is NOT open in ufw on this host (default deny incoming; only 22/80/556/666/
#     5566/8787/3478-udp/41234-udp/51820-udp/4001 are allowed). Verified from the public
#     internet: 202.182.123.154:18080 times out while :80 and :8787 answer 200.
#   * :80 is the only already-open plain-HTTP port, and its default_server belongs to w2m,
#     so IM2A needs its own server_name on the same port.
#   * nip.io wildcard DNS resolves im2a.202.182.123.154.nip.io -> 202.182.123.154, so no
#     DNS zone, certificate or firewall change is needed for this deployment.
# Replace `server_name` with a real domain (and add TLS) when one is available. The
# X-Forwarded-* headers are already set for that migration.

upstream im2a_gateway {
    server 127.0.0.1:18080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name im2a.202.182.123.154.nip.io im2a.local;

    client_max_body_size 8m;

    access_log /var/log/nginx/im2a.access.log;
    error_log  /var/log/nginx/im2a.error.log warn;

    location / {
        proxy_pass http://im2a_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Preserve the original request identity for IM2A audit logs / rate limiting.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # The gateway answers JSON/SSE; do not buffer.
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
