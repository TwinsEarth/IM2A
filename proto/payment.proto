syntax = "proto3";

package human_agent_im.payment;

option go_package = "human-agent-im/proto/gen/payment";

import "common.proto";

// 付费消息账本（§1.3/§6）。不可变账本，仅 INSERT。
// 幂等：message_id 为唯一键；支付回调、消息投递、审批状态变更经同一业务事务 ID 关联，
// 任一侧重试都不会产生二次扣费（§10-R2）。
service PaymentService {
  rpc ReserveCharge(ReserveChargeRequest) returns (LedgerEntry); // 预审通过后占位
  rpc Charge(ChargeRequest) returns (LedgerEntry);               // 发送即扣费/回复触发扣费
  rpc Refund(RefundRequest) returns (LedgerEntry);
  rpc GetLedgerEntry(GetLedgerEntryRequest) returns (LedgerEntry);
  rpc DailyUsage(DailyUsageRequest) returns (DailyUsageResponse);
}

message LedgerEntry {
  string message_id = 1;                        // 幂等唯一键
  uint64 sender_id = 2;
  uint64 receiver_id = 3;
  human_agent_im.common.BillingMode billing_mode = 4;
  int64 amount_cents = 5;
  human_agent_im.common.LedgerStatus status = 6;
  int64 charged_at_unix = 7;
  string approval_card_id = 8;                  // 关联审批卡片
}

message ReserveChargeRequest {
  string message_id = 1;
  uint64 sender_id = 2;
  uint64 receiver_id = 3;
  human_agent_im.common.BillingMode billing_mode = 4;
  int64 amount_cents = 5;
}

message ChargeRequest {
  string message_id = 1;
  string approval_card_id = 2;   // 回复才扣费模式：用户"查看并回复"触发
}

message RefundRequest {
  string message_id = 1;
  string reason = 2;
}

message GetLedgerEntryRequest {
  string message_id = 1;
}

message DailyUsageRequest {
  uint64 sender_id = 1;
  int64 date_unix = 2;           // 所在日零点
}

message DailyUsageResponse {
  uint32 sent_count = 1;         // 当日已发付费消息数
  uint32 daily_limit = 2;        // 单日发送上限
  int64 spent_cents = 3;
}
