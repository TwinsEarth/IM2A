name: npm-publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package directory to publish
        type: choice
        options: [packages/im2a-dsh-plugin]
        default: packages/im2a-dsh-plugin
      dry_run:
        description: Run npm publish --dry-run only
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Verify package metadata
        run: |
          node -e "const p=require('./${{ inputs.package }}/package.json'); if(!p.name||!p.version) process.exit(1); if(p.private===true) process.exit(2); console.log(p.name+'@'+p.version)"
      - name: Dry run
        if: inputs.dry_run
        working-directory: ${{ inputs.package }}
        run: npm publish --dry-run --access public
      - name: Publish with provenance
        if: ${{ !inputs.dry_run }}
        working-directory: ${{ inputs.package }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
