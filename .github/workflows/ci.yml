# IM2A 主线 CI —— 只跑「可复现的本机门禁」，不依赖外部服务
# 说明：旧 main 的 ci.yml 针对已归档的 apps/im2a 实现，未随合并进入主线树；
#      本文件为 v0.1.3 主线首次启用的 CI。
#
# 为什么只跑 Node 24：apps/im-live 的 SQLite 持久化使用 node:sqlite，
# 该模块在 Node 22 需要 --experimental-sqlite（默认关闭），会让全量测试直接失败；
# Node 24 默认可用。核心服务在 22 上可运行，但「全量测试」门禁以 24 为准。
name: ci

on:
  push:
    branches: [main, agent-im]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    name: gates (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 全量测试（单进程 runner，不用 node --test）
        run: node scripts/test.mjs

      - name: 交付物一致性验收（文档/契约/代码三方不漂移）
        run: node scripts/verify.mjs

      - name: 部署产物静态检查
        run: node scripts/deploy-lint.mjs

      - name: 一键自检（起服务 → 自检 → 退出）
        run: node scripts/quickstart.mjs --check
