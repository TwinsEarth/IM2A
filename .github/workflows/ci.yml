# IM2A 主线 CI —— 只跑「可复现的本机门禁」，不依赖外部服务
# 说明：旧 main 的 ci.yml 针对已归档的 apps/im2a 实现，未随合并进入主线树；
#      本文件为 v0.1.3 主线首次启用的 CI（尚未在 GitHub 上实际跑过，首个 run 可能需一次调绿）。
name: ci

on:
  push:
    branches: [main, agent-im]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    name: gates (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 全量测试（单进程 runner，不用 node --test）
        run: node scripts/test.mjs

      - name: 交付物一致性验收（文档/契约/代码三方不漂移）
        run: node scripts/verify.mjs

      - name: 部署产物静态检查
        run: node scripts/deploy-lint.mjs

      - name: 一键自检（起服务 → 自检 → 退出）
        run: node scripts/quickstart.mjs --check
